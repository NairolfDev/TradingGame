name: CI/CD Pipeline – Web, Android & Releases

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: 🧪 Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  build_web:
    name: 🌐 Build & Deploy Web (Firebase)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: tradinggame-austria-prod
        continue-on-error: true

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  build_android:
    name: 🤖 Build Android (APK & Play Console AAB)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB für Play Console)
        run: flutter build appbundle --release

      - name: Rename Artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk trading_game.apk
          cp build/app/outputs/bundle/release/app-release.aab trading_game.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: trading_game.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: trading_game.aab

  build_windows:
    name: 🪟 Build Windows Desktop
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss
          Move-Item windows\TradingGame-Setup.exe TradingGame-Setup.exe

      - name: Compress Windows Portable ZIP
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath TradingGame-Windows-x64.zip

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: TradingGame-Setup.exe

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: TradingGame-Windows-x64.zip

  create_release:
    name: 🚀 Create GitHub Release
    needs: [build_web, build_android, build_windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Trading Game Release ${{ github.ref_name }}'
          body: |
            ## 🚀 Trading Game – Offizielles Release (${{ github.ref_name }})
            
            ### 📥 Downloads:
            - 💻 **Windows Installer Setup** (Empfohlen: Ein-Klick-Installation mit Startmenü & Desktop-Icon): `TradingGame-Setup.exe`
            - 🪟 **Windows Portable ZIP** (Ohne Installation direkt starten): `TradingGame-Windows-x64.zip`
            - 🤖 **Android APK** (Direkte Installation auf dem Smartphone): `trading_game.apk`
            - 📦 **Android App Bundle** (Für Google Play Console Upload): `trading_game.aab`
            - 🌐 **Web-Version**: Live unter [https://tradinggame-live.web.app](https://tradinggame-live.web.app)
            
            ### 🌟 Features & Patch Notes:
            - 📈 **Gigantisches Asset-Universum**: DAX, ATX, US Wall Street, Asien (Tokio/Hongkong), Krypto 24/7, ETFs, CFDs bis 50x Hebel, Staatsanleihen (AT, DE, US, CH, UK) & **Edelmetalle/Rohstoffe (Gold, Silber, Platin, Öl, Kupfer, Lithium)**
            - 📊 **Profi-Broker Charting**: Umschalten zwischen 1D, 1W, 1M, 1Y, ALL, Kerzenchart (Candlesticks) & Linienchart mit gleitendem Durchschnitt (SMA) und Live-Touch-Inspektion
            - ⚖️ **Privatinsolvenz & Kreditsperre**: Reale 5-Tage-Kreditsperre (120h) bei Zahlungsunfähigkeit, gefolgt von Sanierungs-Notkrediten zu Subprime-Konditionen
            - ⏳ **Kredit-Abkühlphase**: 24h Sperre nach Kreditaufnahme verhindert unkontrolliertes Überschulden
            - 🏆 **Prestige & Status-Shop**: Luxusuhren, Sportwagen, Penthouses & Superyachten
            - 🌐 **Server-Backend & REST-API**: Integrierte Firebase Cloud Functions unter `/api/...`
            - 🔄 **In-App Auto-Update System**: Erkennt neue Releases und aktualisiert nahtlos
          files: |
            TradingGame-Setup.exe
            TradingGame-Windows-x64.zip
            trading_game.apk
            trading_game.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
