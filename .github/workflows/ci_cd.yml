name: CI/CD Pipeline – Web, Android & Releases

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: 🧪 Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  build_web:
    name: 🌐 Build & Deploy Web (Firebase)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: tradinggame-austria-prod
        continue-on-error: true

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  build_android:
    name: 🤖 Build Android (APK & Play Console AAB)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB für Play Console)
        run: flutter build appbundle --release

      - name: Rename Artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk trading_game.apk
          cp build/app/outputs/bundle/release/app-release.aab trading_game.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: trading_game.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: trading_game.aab

  build_windows:
    name: 🪟 Build Windows Desktop
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath TradingGame-Windows-x64.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: TradingGame-Windows-x64.zip

  create_release:
    name: 🚀 Create GitHub Release
    needs: [build_web, build_android, build_windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Trading Game Release ${{ github.ref_name }}'
          body: |
            ## 🚀 Trading Game – Börsenspiel Österreich (${{ github.ref_name }})
            
            ### 📥 Downloads:
            - 🤖 **Android APK** (Direkte Installation auf dem Smartphone): `trading_game.apk`
            - 📦 **Android App Bundle** (Für Google Play Console Upload): `trading_game.aab`
            - 🪟 **Windows Portable ZIP** (Entpacken und `trading_game.exe` starten): `TradingGame-Windows-x64.zip`
            - 🌐 **Web-Version**: Live auf Firebase Hosting
            
            ### 🌟 Features:
            - 50.000 € Startguthaben
            - Aktien, Krypto 24/7, ETFs, CFDs bis 50x Hebel, Anleihen mit Zinskupons
            - Echte Börsenöffnungszeiten & automatische Vorab-Orders
            - Prestige-Shop mit Luxusuhren, Sportwagen, Penthouses & Yachten
            - Endlos-Leaderboard
            - Automatischer In-App Update Checker
          files: |
            trading_game.apk
            trading_game.aab
            TradingGame-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
