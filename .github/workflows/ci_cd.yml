name: CI/CD Pipeline – Full Release Matrix

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: 🧪 Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Setup Node for quote validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test quote normalization
        run: node --test functions/market_quotes.test.js

  build_web:
    name: 🌐 Build & Deploy Web (Firebase)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: tradinggame-austria-prod

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  build_android:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: 🤖 Build Android (APK & Play Console AAB)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Android signing secrets are missing"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB für Play Console)
        run: flutter build appbundle --release

      - name: Rename Artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk trading_game.apk
          cp build/app/outputs/bundle/release/app-release.aab trading_game.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: trading_game.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: trading_game.aab

      - name: Deploy to Google Play Console (Auto-Deploy)
        env:
          PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PLAY_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.nairolfdev.tradinggame
          releaseFiles: trading_game.aab
          track: internal
          status: completed
        continue-on-error: true

  build_windows:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: 🪟 Build Windows Desktop
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss
          Move-Item windows\TradingGame-Setup.exe TradingGame-Setup.exe

      - name: Compress Windows Portable ZIP
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath TradingGame-Windows-x64.zip

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: TradingGame-Setup.exe

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: TradingGame-Windows-x64.zip

  build_linux:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: 🐧 Build Linux Desktop
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Linux Bundle
        run: |
          tar -czf TradingGame-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: TradingGame-Linux-x64.tar.gz

  build_macos:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: 🍎 Build macOS Desktop
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release
        continue-on-error: true

      - name: Compress macOS Bundle
        run: |
          if [ -d "build/macos/Build/Products/Release/trading_game.app" ]; then
            cd build/macos/Build/Products/Release
            zip -r -q ../../../../../TradingGame-macOS.zip trading_game.app
            cd ../../../../..
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('TradingGame-macOS.zip') != ''
        with:
          name: macos-release
          path: TradingGame-macOS.zip

  create_release:
    name: 🚀 Publish GitHub Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !cancelled() && needs.build_web.result == 'success' && needs.build_android.result == 'success' && needs.build_windows.result == 'success'
    needs: [build_web, build_android, build_windows, build_linux, build_macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Download Linux Release
        uses: actions/download-artifact@v4
        with:
          name: linux-release

      - name: Download macOS Release
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: 'Trading Game Release ${{ steps.get_version.outputs.version }}'
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## 🚀 Trading Game – Offizielles Release (${{ steps.get_version.outputs.version }})
            
            ### 📥 Downloads:
            - 💻 **Windows Installer Setup** (Empfohlen: Ein-Klick-Installation mit Startmenü & Desktop-Icon): `TradingGame-Setup.exe`
            - 🪟 **Windows Portable ZIP** (Ohne Installation direkt starten): `TradingGame-Windows-x64.zip`
            - 🐧 **Linux Desktop (64-Bit Tar.gz)**: `TradingGame-Linux-x64.tar.gz`
            - 🍎 **macOS Desktop (Universal App ZIP)**: `TradingGame-macOS.zip`
            - 🤖 **Android APK** (Direkte Installation auf dem Smartphone): `trading_game.apk`
            - 📦 **Android App Bundle** (Für Google Play Console): `trading_game.aab`
            - 🌐 **Web-Version**: Live unter [https://tradinggame-live.web.app](https://tradinggame-live.web.app)
            
            ### 🌟 Features & Patch Notes:
            - 📈 **Gigantisches Asset-Universum**: DAX, ATX, US Wall Street, Asien, Krypto 24/7, ETFs, CFDs bis 50x Hebel, Staatsanleihen (AT, DE, US, CH, UK) & **Edelmetalle/Rohstoffe (Gold, Silber, Platin, Öl, Kupfer, Lithium)**
            - 📊 **Profi-Broker Charting**: Umschalten zwischen 1D, 1W, 1M, 1Y, ALL, Kerzenchart (Candlesticks) & Linienchart mit gleitendem Durchschnitt (SMA) und Live-Touch-Inspektion
            - 🚨 **Pflicht-Update-Lock**: Alle Plattformen (Android, Windows, Linux, Mac, Web) erfordern immer die neueste Version, um Weiterspielen zu können
            - ⚖️ **Privatinsolvenz & Kreditsperre**: Reale 5-Tage-Kreditsperre (120h) bei Zahlungsunfähigkeit, gefolgt von Sanierungs-Notkrediten zu Subprime-Konditionen
            - ⏳ **Kredit-Abkühlphase**: 24h Sperre nach Kreditaufnahme verhindert unkontrolliertes Überschulden
            - 🏆 **Prestige & Status-Shop**: Luxusuhren, Sportwagen, Penthouses & Superyachten
            - 🌐 **Server-Backend & REST-API**: Integrierte Firebase Cloud Functions unter `/api/...`
            - 🔄 **In-App Auto-Update System**: Erkennt neue Releases und aktualisiert nahtlos
          files: |
            TradingGame-Setup.exe
            TradingGame-Windows-x64.zip
            TradingGame-Linux-x64.tar.gz
            TradingGame-macOS.zip
            trading_game.apk
            trading_game.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
